name: inspecting
on: push
jobs:
  inspect: 
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
      - name: kernel details
        run: |
          uname -r
          ls
      - name: count
        working-directory: repo
        run: find . -maxdepth 1 -type f | wc -l
